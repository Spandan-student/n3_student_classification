<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Student Segmentation Dashboard</title>
    <script>
      // Apply a saved (or ?theme=dark|light) theme before first paint; otherwise the OS setting is used
      (function () {
        try {
          var forced = new URLSearchParams(location.search).get("theme");
          var theme = forced || localStorage.getItem("n3-theme");
          if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
